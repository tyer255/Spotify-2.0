<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Solid Color for Full Bleed Maskable Safe Zone -->
    <radialGradient id="bgSafe" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>

    <!-- Outer Drop Shadow -->
    <filter id="pwaShadowM" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Emerald Glass Body Radial & Linear Gradients -->
    <radialGradient id="emeraldBodyM" cx="38%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="28%" stop-color="#22c55e" />
      <stop offset="65%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>

    <!-- Glass Dome High Gloss Specular Reflection -->
    <linearGradient id="glossHighlightM" x1="20%" y1="0%" x2="70%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Bottom Rim Bounce Light -->
    <radialGradient id="bottomRimGlowM" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Outer Bezel Gradient -->
    <linearGradient id="goldBezelM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="20%" stop-color="#eab308" />
      <stop offset="45%" stop-color="#713f12" />
      <stop offset="70%" stop-color="#fde047" />
      <stop offset="90%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- 3D Ceramic Wave Filter -->
    <filter id="wave3DM" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#022c22" flood-opacity="0.8" />
    </filter>

    <!-- Ceramic Pill Gradient Top-to-Bottom -->
    <linearGradient id="ceramicWaveM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Crown Gold Gradient -->
    <linearGradient id="crownGoldM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="75%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Gemstone Shimmers -->
    <radialGradient id="rubyGemM" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>
    <radialGradient id="emeraldGemM" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
    <radialGradient id="sapphireGemM" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#172554" />
    </radialGradient>
    <radialGradient id="pearlM" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background ensuring 80% inner safe-zone for Android squircle/circle masks -->
  <rect width="512" height="512" fill="url(#bgSafe)" />

  <!-- Scaled content centered within safe zone (80% circle) -->
  <g transform="translate(30, 25) scale(0.88)" filter="url(#pwaShadowM)">
    <!-- Outer Golden Ring Bezel -->
    <circle cx="236" cy="276" r="218" fill="url(#goldBezelM)" />
    <!-- Inner Dark Groove -->
    <circle cx="236" cy="276" r="210" fill="#041f11" />
    
    <!-- Emerald 3D Glass Dome Sphere -->
    <circle cx="236" cy="276" r="206" fill="url(#emeraldBodyM)" />
    
    <!-- Sphere Bottom Ambient Reflected Light -->
    <circle cx="236" cy="276" r="206" fill="url(#bottomRimGlowM)" />
    
    <!-- 3D WHITE CERAMIC SOUND WAVES (EMBOSSED SPOTIFY ARCS) -->
    <g filter="url(#wave3DM)">
      <!-- Top Arc -->
      <path d="M 126 198 C 170 160, 290 156, 360 212 C 368 218, 368 230, 360 238 C 352 246, 340 246, 332 238 C 274 192, 180 196, 144 226 C 136 234, 124 232, 116 224 C 108 216, 110 204, 126 198 Z" fill="url(#ceramicWaveM)" />
      <!-- Middle Arc -->
      <path d="M 134 262 C 178 228, 282 226, 342 274 C 350 280, 350 292, 342 300 C 334 308, 322 308, 314 300 C 266 262, 184 264, 150 290 C 142 298, 130 296, 122 288 C 114 280, 116 268, 134 262 Z" fill="url(#ceramicWaveM)" />
      <!-- Bottom Arc -->
      <path d="M 144 326 C 182 298, 272 296, 324 338 C 332 344, 332 356, 324 364 C 316 372, 304 372, 296 364 C 256 332, 188 334, 158 354 C 150 362, 138 360, 130 352 C 122 344, 124 332, 144 326 Z" fill="url(#ceramicWaveM)" />
    </g>

    <!-- Curved Gloss Specular Reflection (Top Left Dome Glass) -->
    <path d="M 110 120 C 190 70, 320 80, 390 150 C 360 130, 270 100, 160 140 C 125 152, 110 165, 96 186 C 92 160, 98 135, 110 120 Z" fill="url(#glossHighlightM)" />
    <ellipse cx="210" cy="115" rx="100" ry="32" fill="#ffffff" opacity="0.32" transform="rotate(-15 210 115)" />
    
    <!-- ROYAL GOLD & JEWELED CROWN (Tilted atop Upper Right Edge) -->
    <g transform="translate(385, 125) rotate(24) scale(1.18)">
      <!-- Crown Shadow -->
      <path d="M -68 18 L 68 18 L 62 -22 L 32 0 L 0 -38 L -32 0 L -62 -22 Z" fill="#021c10" opacity="0.6" />

      <!-- Crown Velvet Cap Backing -->
      <path d="M -54 12 C -54 -24, 54 -24, 54 12 Z" fill="#881337" opacity="0.85" />

      <!-- Crown Golden Filigree & Arches -->
      <path d="M -60 15 C -40 22, 40 22, 60 15 L 56 -24 L 28 -2 L 0 -44 L -28 -2 L -56 -24 Z" fill="url(#crownGoldM)" stroke="#78350f" stroke-width="1.5" />
      
      <!-- Crown Golden Cross Orb Crest -->
      <circle cx="0" cy="-48" r="6" fill="url(#crownGoldM)" />
      <rect x="-1.5" y="-57" width="3" height="9" fill="#fef08a" />
      <rect x="-4.5" y="-54" width="9" height="3" fill="#fef08a" />

      <!-- Crown Base Headband -->
      <path d="M -62 14 C -40 22, 40 22, 62 14 L 60 26 C 40 34, -40 34, -60 26 Z" fill="url(#crownGoldM)" stroke="#78350f" stroke-width="1.5" />
      
      <!-- Crown Rim Pearls / Jewels -->
      <circle cx="-56" cy="-24" r="4.5" fill="url(#pearlM)" />
      <circle cx="-28" cy="-2" r="4" fill="url(#rubyGemM)" />
      <circle cx="0" cy="-44" r="4.5" fill="url(#pearlM)" />
      <circle cx="28" cy="-2" r="4" fill="url(#emeraldGemM)" />
      <circle cx="56" cy="-24" r="4.5" fill="url(#pearlM)" />

      <!-- Headband Inset Precious Gemstones -->
      <rect x="-50" y="17" width="7" height="7" rx="1.5" fill="url(#rubyGemM)" />
      <circle cx="-34" cy="21" r="3.5" fill="url(#pearlM)" />
      <rect x="-20" y="17" width="8" height="8" rx="2" fill="url(#sapphireGemM)" />
      <circle cx="-4" cy="23" r="3.5" fill="url(#pearlM)" />
      <rect x="12" y="19" width="8" height="8" rx="2" fill="url(#emeraldGemM)" />
      <circle cx="28" cy="22" r="3.5" fill="url(#pearlM)" />
      <rect x="42" y="17" width="7" height="7" rx="1.5" fill="url(#rubyGemM)" />
    </g>
  </g>
</svg>
